[env:esp32-c3-test]
platform = espressif32 @ 7.1.3
platform_packages = platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
board = esp32-c3-devkitm-1
framework = arduino
extra_scripts = pre:public_build.py
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
